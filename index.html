<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ledger Lab</title>
<meta name="description" content="Free CAPS practice for Grade 9 Accounting and twelve Grade 12 subjects, with corrections flashcards and links to DBE past papers.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Exercise book: green ruled paper, red margin, ink-blue for primary actions. */
:root{
  --paper:#eef3ee; --surface:#ffffff; --ink:#16241d; --muted:#56675e; --rule:#c9d6cb;
  --accent:#1f3680; --accent-ink:#ffffff; --accent-soft:#dce3f5;
  --good:#176644; --good-soft:#daf0e6; --bad:#b02c24; --bad-soft:#fbe4e1;
  --margin:#c8382e; --dot:#b02c24;
  --display:"Lora",Georgia,serif;
  --body:"Inter","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --paper:#101814; --surface:#17221d; --ink:#e7efea; --muted:#9bb0a5; --rule:#2a3c32;
  --accent:#8faaf8; --accent-ink:#0d1a3a; --accent-soft:#1e2c52;
  --good:#55c98a; --good-soft:#143324; --bad:#f07e77; --bad-soft:#3c1a17; --margin:#e05c54; --dot:#f07e77;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#101814; --surface:#17221d; --ink:#e7efea; --muted:#9bb0a5; --rule:#2a3c32;
  --accent:#8faaf8; --accent-ink:#0d1a3a; --accent-soft:#1e2c52;
  --good:#55c98a; --good-soft:#143324; --bad:#f07e77; --bad-soft:#3c1a17; --margin:#e05c54; --dot:#f07e77;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);text-wrap:balance;line-height:1.2;margin:0}
h1{font-size:2.1rem}
h2{font-size:1.4rem}
h3{font-size:1.05rem}
p{margin:0}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}

#app{max-width:1000px;margin:0 auto;padding:0 18px 48px;display:flex;flex-direction:column;gap:22px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;padding:24px 0 12px;border-bottom:3px solid var(--margin)}
.brand{font-family:var(--display);font-weight:700;font-size:1.7rem;line-height:1;color:var(--ink);text-decoration:none}
.brand em{color:var(--dot);font-style:normal}
.tag{color:var(--muted);font-size:.88rem;margin-top:5px}
.back{font-weight:600;font-size:.93rem;min-height:44px;display:inline-flex;align-items:center}
.gswitch{display:flex;border:2px solid var(--accent);border-radius:2px}
.gswitch button{border:0;background:var(--surface);color:var(--accent);font-weight:600;font-size:.93rem;min-height:44px;padding:0 20px;cursor:pointer}
.gswitch button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

.intro{padding-top:8px}
.crumb{color:var(--muted);font-size:.93rem}
.lead{color:var(--muted);max-width:62ch;line-height:1.6}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.gap{margin-top:12px}
.pre{white-space:pre-line}
.view{display:flex;flex-direction:column;gap:22px}

.subjects{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.subject{background:var(--surface);border:1px solid var(--rule);border-top:4px solid var(--rule);border-radius:2px;padding:16px 18px;display:flex;flex-direction:column;gap:7px;text-decoration:none;color:var(--ink);min-height:120px}
.subject:hover,.subject.started{border-top-color:var(--margin)}
.sname{font-family:var(--display);font-weight:700;font-size:1.2rem;line-height:1.25}
.sblurb{color:var(--muted);font-size:.88rem;line-height:1.5}
.prog{margin-top:auto;font-size:.84rem;font-weight:600;color:var(--good)}

nav{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--rule)}
nav a{text-decoration:none;color:var(--muted);padding:12px 16px;font-size:.93rem;font-weight:500;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
nav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--margin);font-weight:600}
nav a:hover{color:var(--ink)}
nav a .n{font-size:.75rem;margin-left:6px;padding:1px 6px;border-radius:2px;background:var(--bad);color:var(--surface);font-weight:700}

.card{background:var(--surface);border:1px solid var(--rule);border-left:4px solid var(--margin);border-radius:2px;padding:20px 20px 20px 22px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--rule);border-top:3px solid var(--margin);border-radius:2px;padding:12px 16px}
.tile b{display:block;font-family:var(--display);font-size:1.8rem;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
.tile span{color:var(--muted);font-size:.82rem}

.btn{display:inline-block;border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:9px 18px;border-radius:2px;font-weight:600;font-size:.93rem;cursor:pointer;text-decoration:none;min-height:44px;line-height:1.5}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.small{padding:4px 11px;font-size:.85rem;min-height:36px}
.btn:disabled{opacity:.4;cursor:not-allowed}

.groups{display:grid;gap:28px}
.groups.multi{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.group{display:flex;flex-direction:column;gap:8px}
.gsub{color:var(--muted);font-size:.88rem;margin-bottom:4px}
.topics{display:grid;gap:10px}
.groups:not(.multi) .topics{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.topic{text-align:left;background:var(--surface);border:1px solid var(--rule);border-radius:2px;padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:8px}
.topic:hover{border-color:var(--accent)}
.topic h3{font-family:var(--body);font-weight:600;font-size:1rem}
.topic small{color:var(--muted);font-size:.84rem}
.bar{height:6px;background:var(--rule);border-radius:1px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--good)}
.meta{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:.86rem}
.num{font-variant-numeric:tabular-nums}

.q{font-size:1.1rem;font-weight:600;max-width:62ch;line-height:1.5}
.opts{display:grid;gap:8px}
.opt{text-align:left;background:var(--surface);border:1.5px solid var(--rule);border-radius:2px;padding:11px 14px;cursor:pointer;min-height:44px}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default;color:var(--ink)}
.fb{padding:13px 16px;border-left:4px solid var(--good);background:var(--good-soft)}
.fb.no{border-left-color:var(--bad);background:var(--bad-soft)}
.fb strong{display:block;margin-bottom:3px}
.fb .saved{display:block;margin-top:6px;font-size:.85rem;color:var(--muted)}

.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg button{border:1.5px solid var(--rule);background:var(--surface);border-radius:2px;padding:8px 4px;cursor:pointer;font-size:.86rem;font-weight:500;min-height:44px}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg button.right{outline:3px solid var(--good);outline-offset:1px}
.eqrow{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:center}
.eqrow b{font-family:var(--display)}
@media (max-width:560px){.eqrow{grid-template-columns:1fr}.seg{grid-template-columns:repeat(2,1fr)}h1{font-size:1.7rem}}
.taccs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.tacc{font-size:.88rem;background:var(--surface);border:1.5px solid var(--ink);border-radius:2px;padding:8px 10px}
.tacc .name{text-align:center;font-weight:600;font-family:var(--display);border-bottom:1.5px solid var(--ink);padding-bottom:4px}
.tacc .sides{display:grid;grid-template-columns:1fr 1fr;min-height:44px}
.tacc .sides div{padding:5px 4px}
.tacc .sides div:first-child{border-right:1.5px solid var(--ink)}
.tacc .sides small{display:block;color:var(--muted);font-size:.78rem}
.journals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.journals button{border:1.5px solid var(--rule);background:var(--surface);border-radius:2px;padding:12px 6px;cursor:pointer;font-weight:700;font-size:1.05rem;font-family:var(--display)}
.journals button small{display:block;font-family:var(--body);font-weight:400;font-size:.75rem;color:var(--muted);margin-top:2px}
.journals button.right{border-color:var(--good);background:var(--good-soft)}
.journals button.wrong{border-color:var(--bad);background:var(--bad-soft)}

input[type=number],textarea{background:var(--surface);border:1.5px solid var(--rule);border-radius:2px;padding:9px 11px;width:100%;min-height:44px}
input[type=number]{max-width:170px}
label{font-weight:600;font-size:.9rem;display:block}
#addForm label{margin-bottom:5px}

.flash{min-height:230px;width:100%;text-align:left;cursor:pointer;border:1px solid var(--rule);border-left:4px solid var(--margin);border-radius:2px;padding:20px 20px 20px 24px;display:flex;flex-direction:column;gap:12px;
  background:repeating-linear-gradient(var(--surface),var(--surface) 31px,var(--rule) 31px,var(--rule) 32px)}
.flash.back{border-left-color:var(--good)}
.flash .side{font-size:.8rem;font-weight:600;color:var(--muted);line-height:32px}
.flash .txt{font-size:1.12rem;font-weight:600;line-height:32px;white-space:pre-line;max-width:60ch}
.flash .hint{margin-top:auto;color:var(--muted);font-size:.84rem}
@media (prefers-reduced-motion:no-preference){.flash.turn{animation:turn .25s ease}}
@keyframes turn{from{transform:rotateX(60deg);opacity:.2}to{transform:none;opacity:1}}

.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;border-bottom:1px solid var(--rule);padding-bottom:8px;font-size:.92rem}
.item:last-child{border-bottom:0;padding-bottom:0}
.src{display:block;font-size:.8rem;font-weight:600;color:var(--muted)}
details summary{cursor:pointer;font-weight:600;min-height:28px}
.papers{display:grid;gap:14px}
.papers a{font-weight:600}
.papers p{color:var(--muted);font-size:.9rem;margin-top:2px}
footer{padding-top:12px;border-top:1px solid var(--rule);color:var(--muted);font-size:.84rem}

</style>
</head>
<body>
<main id="app"></main>
<noscript>Ledger Lab needs JavaScript to run.</noscript>
<script>
window.LL={subjects:[],byId:{},add:function(s){
s.q=s.q.map(function(a,i){return {id:"q"+i,topic:a[0],q:a[1],ans:a[2],opts:[a[2],a[3],a[4],a[5]],why:a[6]}});
this.subjects.push(s);this.byId[s.id]=s}};
LL.EQ8=[
 ["The owner deposits {x} into the business bank account as capital.","up","up","none","Bank","Capital","Bank (asset) increases and Capital (owner's equity) increases."],
 ["Received {x} from a client for services rendered.","up","up","none","Bank","Current income","Bank (asset) increases. Income increases owner's equity."],
 ["Paid rent of {x} by EFT.","down","down","none","Rent expense","Bank","Bank (asset) decreases. Expenses decrease owner's equity."],
 ["Paid wages of {x} by EFT.","down","down","none","Wages","Bank","Bank (asset) decreases. Expenses decrease owner's equity."],
 ["Bought equipment for {x} and paid by EFT.","both","none","none","Equipment","Bank","Equipment (asset) increases and Bank (asset) decreases. One asset is swapped for another."],
 ["The owner took {x} cash for personal use.","down","down","none","Drawings","Bank","Bank (asset) decreases and Drawings decreases owner's equity."],
 ["Received a loan of {x} from Ubuntu Bank.","up","none","up","Bank","Loan: Ubuntu Bank","Bank (asset) increases and the loan (liability) increases."],
 ["Repaid {x} of the loan by EFT.","down","none","down","Loan: Ubuntu Bank","Bank","Bank (asset) decreases and the loan (liability) decreases."],
 ["Paid the telephone account of {x} by EFT.","down","down","none","Telephone","Bank","Bank (asset) decreases. Expenses decrease owner's equity."],
 ["Bought stationery for {x} and paid by EFT.","down","down","none","Stationery","Bank","Bank (asset) decreases. Stationery is an expense, which decreases owner's equity."],
 ["Received rent of {x} from a tenant.","up","up","none","Bank","Rent income","Bank (asset) increases. Income increases owner's equity."],
 ["Bought a vehicle for {x} and paid by EFT.","both","none","none","Vehicles","Bank","Vehicles (asset) increases and Bank (asset) decreases."],
 ["Paid {x} for water and electricity by EFT.","down","down","none","Water and electricity","Bank","Bank (asset) decreases. Expenses decrease owner's equity."],
 ["Paid {x} for an advertisement in the local newspaper.","down","down","none","Advertising","Bank","Bank (asset) decreases. Expenses decrease owner's equity."]
];
LL.JR8=[
 ["Received R850 from a client for services rendered. Issued a receipt.","CRJ","Duplicate receipt","Money was received, so it goes in the Cash Receipts Journal."],
 ["Cash received for services according to the cash register roll, R2 300.","CRJ","Cash register roll","Money was received, so it goes in the Cash Receipts Journal."],
 ["The owner deposited R25 000 into the business bank account as capital.","CRJ","Duplicate receipt","Money came into the business bank account."],
 ["Received R3 000 rent from the tenant.","CRJ","Duplicate receipt","Rent income received is a cash receipt."],
 ["Received a loan of R40 000 from Ubuntu Bank.","CRJ","Bank statement","Money came into the business bank account."],
 ["Paid the rent for the month, R4 500, by EFT.","CPJ","EFT proof of payment","Money left the business bank account."],
 ["Paid wages of R2 800.","CPJ","EFT proof of payment","Wages paid leave the bank account."],
 ["Bought a computer for R9 000 and paid by EFT.","CPJ","EFT proof of payment","It is a payment, even though the business gets an asset in return."],
 ["The owner withdrew R1 000 from the business account for personal use.","CPJ","EFT proof of payment","Drawings are a payment out of the business bank account."],
 ["Paid R600 to the municipality for water and electricity.","CPJ","EFT proof of payment","Money left the business bank account."],
 ["Paid R350 for stationery.","CPJ","EFT proof of payment","Money left the business bank account."],
 ["Repaid R5 000 of the loan to Ubuntu Bank.","CPJ","EFT proof of payment","A loan repayment is a payment out of the bank account."]
];
LL.add({id:"g8-acc",grade:8,name:"Accounting (EMS)",blurb:"Accounting concepts, source documents, the accounting equation, cash journals of a service business",
topics:[
["con","Accounting concepts","Capital, assets, liabilities, income, expenses, profit",""],
["sd","Source documents","Receipts, cash register rolls, EFTs, bank statements",""],
["eq","Accounting equation","Assets = Owner's equity + Liabilities",""],
["crj","Cash Receipts Journal","Money received by a service business",""],
["cpj","Cash Payments Journal","Money paid by a service business",""],
["gl","General Ledger and trial balance","Debit and credit, posting, checking",""]
],
drills:["eq8","jr8","sum8"],
papersLead:"There are no national Grade 8 exam papers, so these are free question banks and revision material from the Western Cape Education Department. Ask your teacher for your school's past tests too.",
papers:[
 ["Western Cape Education Department: Grade 8 EMS item bank, Financial Literacy","https://wcedeportal.co.za/node/84276","A free, CAPS-aligned bank of financial literacy questions for tests and revision."],
 ["Western Cape Education Department: all Grade 8 EMS resources","https://wcedeportal.co.za/browse/grades/8/subjects/economic-management-sciences/type/digital-document","Revision packs, lesson plans and item banks for Grade 8 EMS."]
],
q:[
["con","What is capital?","Money or assets that the owner puts into the business","Money the business borrows from a bank","Money the business earns from customers","Money the owner takes out of the business","Capital is the owner's contribution to start or grow the business. It increases owner's equity."],
["con","What are drawings?","Cash or goods that the owner takes from the business for personal use","Pictures used in advertisements","Money paid to employees","Money received from customers","Drawings decrease owner's equity. They are not a business expense."],
["con","When does a business make a profit?","When its income is more than its expenses","When its expenses are more than its income","When the owner takes drawings","When it borrows money","Profit = income − expenses. If expenses are more than income, the business makes a loss."],
["con","Which of these is an asset?","Equipment","Loan from the bank","Capital","Rent expense","Assets are things the business owns that have value, such as equipment, vehicles and money in the bank."],
["con","Which of these is a liability?","A loan from the bank","Money in the bank account","Vehicles","Current income","Liabilities are debts: money the business owes to others."],
["con","Which of these is an expense of a hair salon?","Wages paid to the assistant","Fees received from customers","The hairdryers and chairs","Capital from the owner","Expenses are the costs of running the business, such as wages, rent, telephone and electricity."],
["con","What is a sole trader?","A business owned by one person","A business owned by the government","A business with many shareholders","A shop that sells only shoes","The owner of a sole trader makes all the decisions and keeps all the profit."],
["con","What is a transaction?","An exchange of value between the business and another party","A list of all employees","The name of the business","A type of bank account","Every transaction, such as receiving fees or paying rent, must be recorded in the books."],

["sd","A business receives cash from a client and issues a receipt. Which copy does the business use to record the transaction?","The duplicate receipt","The original receipt","The bank statement","The deposit slip","The client gets the original receipt. The business keeps the duplicate as its source document for the Cash Receipts Journal."],
["sd","What does a cash register roll show?","The cash received through the cash register (till) for the day","The money the business owes","The salaries of employees","The balance at the bank","The total on the till roll is recorded in the Cash Receipts Journal."],
["sd","The business pays its rent by EFT. What is the source document?","EFT proof of payment","Duplicate receipt","Cash register roll","Deposit slip","An EFT (electronic funds transfer) is a payment made directly from the bank account. The proof of payment is the source document for the Cash Payments Journal."],
["sd","What is a bank statement?","A record from the bank of all the transactions on the business's account","A receipt given to a customer","A list of the business's employees","A letter asking for a loan","The business compares the bank statement with its own records to check them."],
["sd","What is a deposit slip?","Proof that money was deposited into a bank account","Proof that goods were returned","A request for a loan","A list of prices","The bank stamps the deposit slip to confirm that the money was received."],
["sd","Why are source documents important?","They are proof that a transaction took place","They show the owner's home address","They replace the need for journals","They are used to advertise the business","Every entry in the journals is made from a source document."],

["eq","Which is the correct accounting equation?","Assets = Owner's equity + Liabilities","Assets = Owner's equity − Liabilities","Liabilities = Assets + Owner's equity","Owner's equity = Assets + Liabilities","What the business owns (assets) is financed by the owner (owner's equity) and by others (liabilities)."],
["eq","Assets are R50 000 and liabilities are R20 000. What is the owner's equity?","R30 000","R70 000","R20 000","R50 000","Owner's equity = Assets − Liabilities = 50 000 − 20 000 = R30 000."],
["eq","Owner's equity is R40 000 and liabilities are R15 000. What are the total assets?","R55 000","R25 000","R40 000","R15 000","Assets = Owner's equity + Liabilities = 40 000 + 15 000 = R55 000."],
["eq","The owner deposits R10 000 into the business bank account as capital. What is the effect?","Assets increase and owner's equity increases","Assets increase and liabilities increase","Assets decrease and owner's equity decreases","Only assets increase","Bank (an asset) increases and Capital (owner's equity) increases."],
["eq","The business pays wages of R2 000. What is the effect?","Assets decrease and owner's equity decreases","Assets decrease and liabilities decrease","Assets increase and owner's equity increases","Only liabilities decrease","Bank (an asset) decreases. Wages is an expense, and expenses decrease owner's equity."],
["eq","The business buys equipment for R5 000 and pays by EFT. What is the effect?","One asset increases and another asset decreases","Assets increase and liabilities increase","Assets decrease and owner's equity decreases","Owner's equity increases","Equipment increases and Bank decreases by the same amount, so total assets do not change."],
["eq","What effect does income have on owner's equity?","It increases owner's equity","It decreases owner's equity","It has no effect","It increases liabilities","Income increases owner's equity. Expenses and drawings decrease it."],

["crj","What is recorded in the Cash Receipts Journal?","All money received by the business","All money paid by the business","Goods bought on credit","The owner's personal spending","The CRJ records receipts such as fees from clients, capital from the owner and rent received."],
["crj","In the CRJ of a service business, in which column are fees for services rendered recorded?","Current income","Sundry accounts","Drawings","Wages","Current income is the main income of a service business, so it has its own column."],
["crj","The owner deposits R30 000 as capital. Which CRJ columns are used?","Analysis of receipts, Bank and Sundry accounts","Bank and Current income","Bank and Wages","Current income and Sundry accounts","Capital does not have its own column, so it is entered under Sundry accounts with the account name Capital."],
["crj","What does the Bank column in the CRJ show?","The total amount deposited in the bank","The amount paid to employees","The amount the business owes","The owner's drawings","Amounts in the Analysis of receipts column are added up and the total deposited is entered in the Bank column."],
["crj","Which transaction is recorded in the Cash Receipts Journal?","Received R800 from a client for services rendered","Paid R800 for telephone","Bought stationery for R800 by EFT","The owner withdrew R800 for personal use","Only money received goes in the CRJ. The other three are payments."],
["crj","Rent of R2 500 is received from a tenant. In which CRJ column is the Rent income amount entered?","Sundry accounts","Current income","Wages","Stationery","Rent income is not the main income of the business and has no column of its own, so it goes under Sundry accounts."],

["cpj","What is recorded in the Cash Payments Journal?","All payments made by the business","All money received by the business","Services rendered on credit","Only the owner's capital","The CPJ records payments such as wages, rent, stationery, equipment bought and drawings."],
["cpj","The business pays wages of R3 000. Which CPJ columns are used?","Bank and Wages","Bank and Current income","Analysis of receipts and Bank","Wages and Sundry accounts","The Bank column shows the money paid out and the Wages column shows what it was paid for."],
["cpj","The owner withdraws R500 from the business for personal use. Where is it recorded?","In the CPJ, as Drawings","In the CRJ, as Current income","In the CPJ, as Wages","In the CRJ, as Capital","Money left the business bank account, so it goes in the CPJ. The account is Drawings."],
["cpj","Which transaction is recorded in the Cash Payments Journal?","Paid the telephone account by EFT","Received fees from a client","The owner deposited capital","Received a loan from the bank","Only payments go in the CPJ. The other three are receipts."],
["cpj","The business buys equipment for R6 000 by EFT. There is no Equipment column in the CPJ. Which columns are used?","Bank and Sundry accounts","Bank and Wages","Bank and Stationery","Current income and Bank","Accounts without their own column are entered under Sundry accounts, with the account name written in."],
["cpj","What is written in the 'Name of payee' column of the CPJ?","The person or business that was paid","The owner's name every time","The name of the bank","The name of the client who paid","The payee is the one who receives the payment."],

["gl","Which side of a ledger account is the debit side?","The left-hand side","The right-hand side","The top","The bottom","Debit is on the left and credit is on the right."],
["gl","On which side does the Bank account increase?","Debit side","Credit side","Both sides","Neither side","Bank is an asset. Assets increase on the debit side and decrease on the credit side."],

["cf","Inventory increased from R80 000 to R110 000 during the year. How does this affect the cash generated from operations?","It is an outflow of R30 000","It is an inflow of R30 000","It is an outflow of R110 000","It has no effect on cash","More money is tied up in stock. An increase in inventory of R30 000 is shown as a decrease in cash in the working capital changes."],
["cf","A loan of R200 000 is repaid during the year. Where does this appear?","As an outflow under financing activities","As an outflow under investing activities","As an expense under operating activities","It does not appear in the Cash Flow Statement","Raising and repaying loans are financing activities. A repayment is cash going out."],

["ai","Which ratio measures the liquidity of a company?","Current ratio","Debt-equity ratio","Return on shareholders' equity","Earnings per share","Liquidity is the ability to pay short-term debts. The current ratio and acid-test ratio measure it."],
["ai","A company's debt-equity ratio increases from 0,3 : 1 to 0,9 : 1. What does this mean?","The company relies more on borrowed funds, so its financial risk has increased","The company can pay its short-term debts more easily","The company has become more profitable","Shareholders are earning higher dividends","Debt-equity compares loans with shareholders' equity. A higher ratio means more borrowing and higher risk (higher gearing)."],
["ai","Return on total capital employed is 15% and the interest rate on loans is 11%. What does this show?","Positive gearing: the company earns more on borrowed money than it pays in interest","Negative gearing: loans cost more than they earn","The company cannot repay its loans","The company is insolvent","When ROTCE is higher than the interest rate on loans, borrowing is working in the company's favour."],
["ai","Which indicator would a shareholder compare with the interest rate on a fixed deposit?","Return on shareholders' equity","Acid-test ratio","Stock turnover rate","Debtors' collection period","ROSHE shows what shareholders earn on their investment, so it is compared with returns on other investments such as fixed deposits."],
["ai","Earnings per share is 150 cents and dividends per share is 60 cents. What does this suggest?","The company kept most of its earnings for future growth","The company paid out more than it earned","The company made a loss","The share price fell","Only 60 of the 150 cents earned per share was paid out. The rest was retained in the company."],

["fa","Equipment cost R100 000. Depreciation is 20% p.a. on the diminishing-balance method. What is the depreciation in the second year?","R16 000","R20 000","R40 000","R36 000","Year 1: 100 000 x 20% = R20 000. Carrying value is then R80 000. Year 2: 80 000 x 20% = R16 000."],
["fa","A vehicle with a cost of R200 000 and accumulated depreciation of R150 000 is sold for R60 000 cash. What is the result?","A profit of R10 000","A loss of R10 000","A profit of R60 000","A loss of R140 000","Carrying value = 200 000 - 150 000 = R50 000. It was sold for R60 000, so there is a profit of R10 000."],
["fa","What is the carrying value of a fixed asset?","Cost price minus accumulated depreciation","Cost price plus accumulated depreciation","The price it could be sold for today","The depreciation for the current year","Carrying (book) value is what is left of the cost after all depreciation to date has been taken off."],
["fa","On the straight-line (cost price) method, the depreciation amount each full year:","Stays the same","Gets smaller every year","Gets bigger every year","Depends on the profit","The percentage is always applied to the original cost, so the amount is the same every full year."],

["au","An independent auditor reports that the financial statements 'fairly present' the company's position. What kind of report is this?","An unqualified audit report","A qualified audit report","A disclaimer of opinion","An internal audit report","An unqualified report is the best outcome: the auditors found no significant problems."],
["au","Who appoints the external auditors of a public company?","The shareholders, at the annual general meeting","The chief executive officer","SARS","The company's bank","The auditors report to the shareholders, so the shareholders appoint them at the AGM. This keeps the auditors independent of management."],
["au","What is the King Code mainly about?","Good corporate governance: ethical, transparent and accountable management","How to calculate company tax","The format of the Cash Flow Statement","Rules for listing on the JSE only","The King Code sets out principles of good corporate governance for South African organisations."],
["au","What does a disclaimer of opinion mean?","The auditors could not get enough evidence to form an opinion","The statements are completely correct","The auditors found one small error","The company chose not to be audited","A disclaimer is the worst outcome. The records were so poor or incomplete that the auditors could not express an opinion."],

["rec","A payment is recorded in the Cash Payments Journal but does not yet appear on the bank statement. How is it treated in the Bank Reconciliation Statement?","It is listed as an outstanding payment","It is recorded again in the Cash Payments Journal","It is recorded in the Cash Receipts Journal","It is ignored","The business has recorded it but the bank has not yet processed it, so it is a reconciling item on the statement."],
["rec","Bank charges appear on the bank statement but not in the journals. What must be done?","Record them in the Cash Payments Journal","Record them in the Cash Receipts Journal","List them as an outstanding deposit","Ask the bank to remove them","The bank has already taken the money, so the business must update its own records in the CPJ."],
["rec","A business has money in its bank account. How does this balance appear on the bank statement?","As a credit balance","As a debit balance","As a nil balance","As an overdraft","The statement is drawn up from the bank's point of view. The bank owes the money to the business, so it shows a credit balance."],
["rec","A debtor's EFT of R2 500 was recorded in the Cash Receipts Journal but was not posted to her account in the Debtors Ledger. What must be corrected?","The debtors list: reduce it by R2 500","The Debtors Control account: reduce it by R2 500","Both the control account and the debtors list","Neither, the totals will still agree","The journal total (and so the control account) is right. Only the individual debtor's account was missed, so the list is corrected."],
["rec","Why does a business reconcile a creditor's statement with the creditor's account in its own ledger?","To find errors and omissions before paying","To increase the amount it owes","To calculate VAT","To work out the mark-up","Comparing the two records shows missing invoices, wrong amounts or payments not yet recorded. This is internal control."],

["vat","VAT that a business charges on its sales is called:","Output VAT","Input VAT","Provisional tax","PAYE","Output VAT is collected from customers on behalf of SARS. Input VAT is paid on purchases and can be claimed back."],
["vat","Output VAT for the period is R45 000 and input VAT is R30 000. What is the position with SARS?","The business owes SARS R15 000","SARS owes the business R15 000","The business owes SARS R75 000","SARS owes the business R45 000","Output VAT is owed to SARS and input VAT is claimed back: 45 000 - 30 000 = R15 000 payable."],
["vat","An item costs R1 150 including VAT at 15%. How much VAT is included in the price?","R150","R172,50","R115","R1 000","VAT = 1 150 x 15/115 = R150. The price before VAT is R1 000."],
["vat","Which of these is zero-rated for VAT in South Africa?","Brown bread","Restaurant meals","Clothing","Electricity","Certain basic foods, such as brown bread, maize meal and milk, are zero-rated to help poorer households."],

["inv","What does the FIFO method assume?","The oldest stock is sold first","The newest stock is sold first","All stock costs the same","Stock is never sold","First in, first out. Closing stock is therefore valued at the most recent purchase prices."],
["inv","Opening stock is 100 units at R10 each. Purchases are 300 units at R12 each. What is the weighted average cost per unit?","R11,50","R11,00","R12,00","R10,00","Total cost = 1 000 + 3 600 = R4 600. Total units = 400. 4 600 / 400 = R11,50."],
["inv","Using FIFO: opening stock is 100 units at R10, purchases are 300 units at R12, and 150 units are on hand at year-end. What is the value of closing stock?","R1 800","R1 500","R1 725","R1 650","Under FIFO the units left are from the latest purchase: 150 x R12 = R1 800."],
["inv","Which valuation method suits a business that sells a few expensive items that can each be identified, such as cars?","Specific identification","FIFO","Weighted average","Periodic average","Each item is recorded at its own cost price, which is practical only for high-value, low-volume stock."],

["cost","Wages paid to factory workers who physically make the product are:","Direct labour cost","Factory overhead cost","Administration cost","Selling and distribution cost","Direct labour is the cost of workers who work on the product itself."],
["cost","Prime cost is equal to:","Direct material cost plus direct labour cost","Direct labour cost plus factory overhead cost","Total cost of production plus administration cost","Fixed cost plus variable cost","Prime cost = direct materials + direct labour. Adding factory overheads gives the total cost of production."],
["cost","Fixed costs are R120 000. The selling price is R50 per unit and the variable cost is R30 per unit. What is the break-even point?","6 000 units","2 400 units","4 000 units","1 500 units","Contribution per unit = 50 - 30 = R20. Break-even = 120 000 / 20 = 6 000 units."],
["cost","Rent of the factory building is an example of:","Factory overhead cost","Direct material cost","Administration cost","Selling and distribution cost","Factory rent is a cost of production that cannot be traced to one product, so it is a factory overhead."],
["cost","If production increases, what happens to the fixed cost per unit?","It decreases","It increases","It stays the same","It becomes a variable cost","Total fixed costs stay the same, so spreading them over more units gives a lower fixed cost per unit (economies of scale)."],

["bud","Which item appears in a Cash Budget but not in a Projected Statement of Comprehensive Income?","Repayment of a loan","Depreciation","Bad debts","Cost of sales","Repaying a loan uses cash but is not an expense. Depreciation and bad debts are expenses that involve no cash."],
["bud","Which item appears in a Projected Statement of Comprehensive Income but not in a Cash Budget?","Depreciation","Rent paid","Cash sales","Salaries paid","Depreciation is a non-cash expense. A Cash Budget shows only actual receipts and payments."],
["bud","Credit sales in March are R80 000. Debtors pay 60% of their accounts in the month after the sale. How much cash from March's sales is expected in April?","R48 000","R80 000","R32 000","R60 000","80 000 x 60% = R48 000 is collected in April."],
["bud","What is the main purpose of a Cash Budget?","To plan expected cash receipts and payments so that shortfalls can be seen in advance","To calculate the income tax payable","To show the profit for the past year","To value the closing stock","A Cash Budget is a forecast. It lets management see in advance when the bank balance will be low."]
],
terms:[
["Ordinary share capital","The money the company received from issuing shares to its shareholders. Part of shareholders' equity."],
["Retained income","Profit that has been kept in the company and not paid out as dividends. Part of shareholders' equity."],
["Dividends","The part of the profit that is paid to shareholders. Interim dividends are paid during the year, final dividends are declared at year-end."],
["Liquidity","The ability of a business to pay its short-term debts.\nMeasured by the current ratio and the acid-test ratio."],
["Solvency","The ability of a business to pay all its debts. Total assets must be more than total liabilities."],
["Gearing","How much a company relies on borrowed funds. Measured by the debt-equity ratio.\nGearing is positive when ROTCE is higher than the interest rate on loans."],
["Earnings per share (EPS)","Net profit after tax divided by the number of shares issued, in cents."],
["Net asset value per share","Shareholders' equity divided by the number of shares issued, in cents. Compared with the market price on the JSE."],
["Carrying value","Cost price of a fixed asset minus its accumulated depreciation."],
["Unqualified audit report","The auditors' opinion that the financial statements fairly present the company's results and position."],
["Input VAT","VAT a business pays on its purchases and expenses. It is claimed back from SARS."],
["Output VAT","VAT a business charges on its sales. It is paid over to SARS."],
["FIFO","First in, first out. Stock valuation method that assumes the oldest stock is sold first."],
["Prime cost","Direct material cost plus direct labour cost."],
["Break-even point","The number of units at which total income equals total costs, so there is no profit or loss.\nFixed costs divided by contribution per unit."],
["Cash Budget","A forecast of expected cash receipts and cash payments for a future period."]
]});

["alg","The discriminant of a quadratic equation is negative. What is the nature of the roots?","Non-real","Real, rational and equal","Real, rational and unequal","Real and irrational","If b² − 4ac < 0 the square root in the quadratic formula has no real value, so the roots are non-real."],
["alg","Solve for x: x² − 4 < 0","−2 < x < 2","x < −2 or x > 2","x < 2","x > −2","(x − 2)(x + 2) < 0. The product is negative only between the critical values −2 and 2."],
["alg","For which value of k does x² + 6x + k = 0 have equal roots?","k = 9","k = 6","k = 36","k = −9","Equal roots need b² − 4ac = 0: 36 − 4k = 0, so k = 9."],

["seq","What is the general term of the sequence 3; 7; 11; 15; ...?","Tₙ = 4n − 1","Tₙ = 4n + 3","Tₙ = 3n + 4","Tₙ = n + 4","It is arithmetic with a = 3 and d = 4. Tₙ = a + (n − 1)d = 3 + 4n − 4 = 4n − 1."],
["seq","What is the general term of the sequence 2; 6; 18; 54; ...?","Tₙ = 2·3ⁿ⁻¹","Tₙ = 3·2ⁿ⁻¹","Tₙ = 4n − 2","Tₙ = 2ⁿ + 3","It is geometric with a = 2 and r = 3. Tₙ = arⁿ⁻¹ = 2·3ⁿ⁻¹."],
["seq","For which values of r does a geometric series converge?","−1 < r < 1","r > 1","r < −1","r = 1","The sum to infinity exists only when the terms get smaller and smaller, which needs −1 < r < 1."],
["seq","What is the second difference of the quadratic pattern 2; 5; 10; 17; ...?","2","3","5","7","First differences are 3; 5; 7. The difference between them is 2 each time."],
["seq","What is the sum to infinity of 8 + 4 + 2 + 1 + ...?","16","15","8","There is no sum to infinity","a = 8 and r = ½. S∞ = a/(1 − r) = 8/(½) = 16."],

["fun","What is the inverse of f(x) = 2x + 4?","f⁻¹(x) = (x − 4)/2","f⁻¹(x) = 2x − 4","f⁻¹(x) = (x + 4)/2","f⁻¹(x) = 4x + 2","Swap x and y: x = 2y + 4, so y = (x − 4)/2."],
["fun","What is the inverse of y = 2ˣ?","y = log₂x","y = x²","y = 2/x","y = log x²","Swap x and y: x = 2ʸ. Written in log form, y = log₂x."],
["fun","What is the turning point of y = (x − 1)² − 4?","(1; −4)","(−1; −4)","(1; 4)","(−4; 1)","In the form y = a(x − p)² + q the turning point is (p; q) = (1; −4)."],
["fun","What are the asymptotes of y = 3/(x − 2) + 1?","x = 2 and y = 1","x = −2 and y = 1","x = 2 and y = −1","x = 1 and y = 2","For y = a/(x − p) + q the asymptotes are x = p and y = q."],
["fun","The graph of f(x) = x² is reflected in the line y = x. Why is the result not a function?","One x-value now has two y-values","It has no x-intercept","It has a turning point","It is not a straight line","The inverse is x = y², so for example x = 4 gives y = 2 and y = −2. The domain of f must be restricted first."],

["fin","R10 000 is invested at 10% p.a. compounded annually. What is it worth after 2 years?","R12 100","R12 000","R11 000","R12 210","A = P(1 + i)ⁿ = 10 000(1,1)² = R12 100."],
["fin","Which formula is used for depreciation on the reducing-balance method?","A = P(1 − i)ⁿ","A = P(1 + in)","A = P(1 − in)","A = P(1 + i)ⁿ","Reducing balance is compound decay. A = P(1 − in) is straight-line depreciation."],
["fin","An interest rate is 12% p.a. compounded monthly. What rate is applied each month?","1%","12%","0,12%","1,2%","Divide the nominal annual rate by the number of compounding periods: 12% / 12 = 1% per month."],
["fin","Which gives the highest effective interest rate?","12% p.a. compounded monthly","12% p.a. compounded quarterly","12% p.a. compounded half-yearly","12% p.a. compounded annually","The more often interest is compounded, the more interest is earned on interest, so the effective rate is higher."],

["calc","What is the derivative of f(x) = x³?","3x²","x²","3x³","x⁴/4","Power rule: multiply by the power and reduce the power by one."],
["calc","What is the derivative of f(x) = 5x² − 3x + 7?","10x − 3","5x − 3","10x + 7","10x² − 3x","Differentiate term by term: 5x² gives 10x, −3x gives −3 and the constant 7 gives 0."],
["calc","At which x-value does f(x) = x² − 4x have a turning point?","x = 2","x = 4","x = 0","x = −2","f′(x) = 2x − 4. Set it equal to 0: x = 2."],
["calc","At a local maximum of f, which is true?","f′(x) = 0 and f″(x) < 0","f′(x) = 0 and f″(x) > 0","f′(x) > 0 and f″(x) = 0","f(x) = 0","The gradient is zero at a turning point. The graph is concave down at a maximum, so the second derivative is negative."],
["calc","Which expression defines f′(x) from first principles?","The limit as h → 0 of [f(x + h) − f(x)]/h","[f(x + h) − f(x)]/h with h = 1","The limit as h → 0 of f(x + h) − f(x)","f(x + h)/h","The derivative is the limit of the average gradient between x and x + h as h shrinks to zero."],

["prob","Events A and B are mutually exclusive. Which is true?","P(A or B) = P(A) + P(B)","P(A and B) = P(A) × P(B)","P(A or B) = 1","P(A) = P(B)","Mutually exclusive events cannot happen together, so P(A and B) = 0 and the addition rule has nothing to subtract."],
["prob","Events A and B are independent. Which is true?","P(A and B) = P(A) × P(B)","P(A and B) = 0","P(A or B) = P(A) + P(B)","P(A) + P(B) = 1","Independent events do not affect each other, so the probability of both is the product."],
["prob","In how many ways can the letters of the word MATHS be arranged?","120","25","5","60","Five different letters: 5! = 5 × 4 × 3 × 2 × 1 = 120."],
["prob","P(A) = 0,4. What is P(not A)?","0,6","0,4","1,4","0,16","Complementary events add up to 1: 1 − 0,4 = 0,6."],

["stat","What does the standard deviation of a data set measure?","How spread out the data is around the mean","The middle value of the data","The most common value","The difference between the largest and smallest values","A small standard deviation means the values are close to the mean. A large one means they are spread out."],
["stat","A correlation coefficient of r = −0,95 shows:","A strong negative linear relationship","A weak negative linear relationship","A strong positive linear relationship","No relationship","r close to −1 means the points lie close to a straight line that slopes downward."],
["stat","A five-number summary is 2; 5; 8; 12; 20. What is the interquartile range?","7","18","6","3","IQR = Q₃ − Q₁ = 12 − 5 = 7."],
["stat","On an ogive (cumulative frequency curve) for 80 learners, where is the median read off?","At a cumulative frequency of 40","At a cumulative frequency of 80","At the highest point of the curve","At the first plotted point","The median is the middle value, so it is read at half the total frequency."],

["ana","What is the gradient of the line through (1; 2) and (3; 8)?","3","⅓","6","−3","m = (8 − 2)/(3 − 1) = 6/2 = 3."],
["ana","Two lines are perpendicular. What is true of their gradients?","Their product is −1","They are equal","Their sum is 0","Their product is 1","For perpendicular lines m₁ × m₂ = −1. Parallel lines have equal gradients."],
["ana","What is the midpoint of the line segment joining (2; 4) and (6; 10)?","(4; 7)","(8; 14)","(2; 3)","(4; 6)","Average the x-values and the y-values: ((2 + 6)/2; (4 + 10)/2) = (4; 7)."],
["ana","What are the centre and radius of the circle (x − 2)² + (y + 3)² = 16?","Centre (2; −3), radius 4","Centre (−2; 3), radius 4","Centre (2; −3), radius 16","Centre (2; 3), radius 8","In (x − a)² + (y − b)² = r² the centre is (a; b) and r² = 16, so r = 4."],

["trig","Which expression is equal to cos 2A?","1 − 2sin²A","2 sin A cos A","1 − 2cos²A","sin²A − cos²A","cos 2A = cos²A − sin²A = 1 − 2sin²A = 2cos²A − 1. 2 sin A cos A is sin 2A."],
["trig","What is the period of y = sin 2x?","180°","360°","720°","90°","The period of y = sin kx is 360°/k = 360°/2 = 180°."],
["trig","Which formula gives the area of triangle ABC when two sides and the included angle are known?","Area = ½ab sin C","Area = ab cos C","Area = ½ab cos C","Area = a/sin A","The area rule uses two sides and the angle between them."],

["euc","The opposite angles of a cyclic quadrilateral are:","Supplementary","Equal","Complementary","Each 90°","They add up to 180°."],
["euc","The angle between a tangent and a chord is equal to:","The angle in the alternate segment","The angle at the centre","90°","Half the angle in the same segment","This is the tan-chord theorem."],
["euc","A line drawn parallel to one side of a triangle divides the other two sides:","Proportionally","Into equal halves","At right angles","Into a 2 : 1 ratio","This is the proportionality theorem. The midpoint theorem is the special case where the ratio is 1 : 1."]
],

q:[
["mech","According to Newton's second law, the acceleration of an object is:","Directly proportional to the net force and inversely proportional to its mass","Directly proportional to its mass and inversely proportional to the net force","Always constant","Equal to its velocity","F(net) = ma. A bigger net force gives a bigger acceleration, and a bigger mass gives a smaller one."],
["mech","Which statement about a Newton's third law force pair is correct?","The forces are equal in size, opposite in direction and act on different objects","The forces act on the same object and cancel out","The bigger object exerts the bigger force","The forces act in the same direction","When A exerts a force on B, B exerts an equal and opposite force on A. Because they act on different objects they do not cancel."],

["proj","An object is in free fall when:","The only force acting on it is the gravitational force","It moves downward at constant velocity","Air resistance equals its weight","No forces act on it","In free fall all objects near the Earth's surface accelerate at 9,8 m·s⁻² downward, whatever their mass."],

["wave","An ambulance with its siren on moves towards a stationary listener. Compared with the frequency of the siren, the listener hears:","A higher frequency","A lower frequency","The same frequency","No sound","The waves in front of the moving source are compressed, so the wavelength is shorter and the observed frequency is higher. This is the Doppler effect."],

["wave","What is the work function of a metal?","The minimum energy needed to eject an electron from the surface of the metal","The maximum kinetic energy of an ejected electron","The energy of the incoming photon","The energy needed to melt the metal","W₀ = hf₀, where f₀ is the threshold frequency. E = W₀ + Ek(max)."],

q:[
["repro","Where in the female reproductive system does fertilisation normally take place?","In the Fallopian tube","In the uterus","In the ovary","In the vagina","The sperm meets the ovum in the Fallopian tube (oviduct). The zygote then moves to the uterus."],

["repro","Which hormone is secreted by the corpus luteum to maintain the endometrium?","Progesterone","FSH","LH","Testosterone","Progesterone keeps the lining of the uterus thick and rich in blood vessels in case implantation takes place."],
["repro","Where is testosterone produced?","In the testes","In the prostate gland","In the epididymis","In the seminal vesicles","The cells of Leydig in the testes secrete testosterone, which controls male secondary sexual characteristics and sperm production."],
["repro","What is the main function of the placenta?","Exchange of nutrients, gases and wastes between mother and foetus","Production of ova","Protection of the foetus from knocks","Production of sperm","The blood of the mother and the foetus do not mix, but substances diffuse across the placenta. It also secretes progesterone."],
["repro","What is implantation?","The attachment of the blastocyst to the endometrium","The release of an ovum from the ovary","The fusion of a sperm and an ovum","The shedding of the lining of the uterus","About a week after fertilisation the blastocyst embeds itself in the lining of the uterus."],

["resp","Which type of neuron carries impulses from a receptor to the central nervous system?","Sensory neuron","Motor neuron","Interneuron","Effector","Sensory (afferent) neurons carry impulses towards the CNS. Motor neurons carry impulses from the CNS to effectors."],
["resp","Which part of the brain coordinates voluntary movement and balance?","Cerebellum","Cerebrum","Medulla oblongata","Hypothalamus","The cerebellum coordinates muscle action. The medulla oblongata controls breathing and heart rate."],
["resp","Why is a reflex action important?","It is a rapid, automatic response that protects the body from harm","It allows us to think carefully before acting","It only involves hormones","It improves memory","A reflex arc bypasses conscious thought, so the response is very fast."],
["resp","What happens in the eye when a person looks at a nearby object?","The ciliary muscles contract and the lens becomes more convex","The ciliary muscles relax and the lens becomes flatter","The pupil closes completely","The retina moves forward","This is accommodation. A more rounded lens bends light more, so the image focuses on the retina."],
["resp","Which part of the ear converts sound vibrations into nerve impulses?","The cochlea","The eardrum","The Eustachian tube","The semicircular canals","The organ of Corti inside the cochlea contains the receptor cells for hearing. The semicircular canals are for balance."],
["resp","A plant stem bends towards light. How do auxins cause this?","Auxins collect on the shaded side and cause those cells to elongate more","Auxins collect on the lit side and cause those cells to elongate more","Auxins are destroyed on the shaded side","Auxins stop all growth","Faster growth on the dark side makes the stem bend towards the light. This is phototropism."],

["homeo","Which hormone lowers the blood glucose level?","Insulin","Glucagon","Adrenalin","Thyroxin","Insulin is secreted by the pancreas (islets of Langerhans). It causes glucose to be converted to glycogen in the liver and muscles."],
["homeo","What is the effect of ADH on the kidneys?","More water is reabsorbed, so less urine is produced","Less water is reabsorbed, so more urine is produced","More glucose is excreted","More salt is excreted","ADH makes the collecting ducts and distal tubules more permeable to water. It is released when the blood has too little water."],
["homeo","Which hormone controls the basal metabolic rate?","Thyroxin","Insulin","ADH","Aldosterone","Thyroxin is secreted by the thyroid gland. Its secretion is controlled by TSH from the pituitary gland."],
["homeo","What is negative feedback?","A mechanism that reverses a change to bring conditions back to normal","A mechanism that makes a change bigger","A response that damages the body","A reflex action","For example, a rise in blood glucose leads to insulin release, which lowers the glucose level again."],
["homeo","How does the skin help to cool the body on a hot day?","Blood vessels dilate and more sweat is produced","Blood vessels constrict and less sweat is produced","Hairs stand upright","Shivering begins","Vasodilation brings more blood to the surface so more heat is lost, and evaporating sweat cools the skin."],
["homeo","Which hormone prepares the body for an emergency ('fight or flight')?","Adrenalin","Insulin","Growth hormone","Prolactin","Adrenalin from the adrenal glands increases the heart rate, breathing rate and blood glucose level."],

["dna","What are the monomers (building blocks) of DNA?","Nucleotides","Amino acids","Glucose molecules","Fatty acids","Each nucleotide consists of a phosphate, a deoxyribose sugar and a nitrogenous base."],
["dna","In DNA, adenine always pairs with:","Thymine","Guanine","Cytosine","Uracil","A pairs with T and G pairs with C, joined by weak hydrogen bonds."],

["dna","What is the role of tRNA in protein synthesis?","It carries specific amino acids to the ribosome","It carries the code from the nucleus to the ribosome","It forms the ribosome","It unwinds the DNA","The anticodon on each tRNA matches a codon on the mRNA, so amino acids are joined in the correct order (translation)."],

q:[
["clim","In which direction do mid-latitude cyclones generally move across South Africa?","From west to east","From east to west","From north to south","From south to north","They form in the westerly wind belt, so they are carried eastward. Cold fronts reach the Western Cape first, mostly in winter."],
["clim","What happens at a cold front?","Cold air moves in under warm air and forces it to rise quickly","Warm air slides gently over cold air","Air sinks and warms up","Two warm air masses meet","The rapid uplift forms cumulonimbus clouds, heavy rain, a drop in temperature and a change in wind direction."],
["clim","Which condition is needed for a tropical cyclone to form?","A sea surface temperature of about 27 °C or higher","A cold ocean current","A position exactly on the equator","Dry air over a desert","Warm ocean water supplies moisture and latent heat. Cyclones also need Coriolis force, so they do not form within about 5° of the equator."],
["clim","What are conditions like in the eye of a tropical cyclone?","Calm and clear, with sinking air","The strongest winds and heaviest rain","Freezing temperatures","Thick cumulonimbus cloud","The most violent weather is in the eye wall around the eye."],
["clim","Why does a tropical cyclone weaken when it moves over land?","It is cut off from its supply of moisture and latent heat, and friction increases","The land is warmer than the sea","The Coriolis force disappears","The air pressure in the eye drops further","Warm ocean water is the energy source of the storm."],
["clim","In which direction does air circulate around a low-pressure system in the Southern Hemisphere?","Clockwise","Anticlockwise","Straight outward","Straight upward only","Around a low (cyclone) in the Southern Hemisphere air moves clockwise and inward. Around a high it moves anticlockwise and outward."],

["loc","Which three high-pressure cells influence South Africa's weather?","South Atlantic, South Indian and Kalahari high-pressure cells","Siberian, Azores and Kalahari high-pressure cells","North Atlantic, Pacific and Arctic high-pressure cells","Equatorial, Polar and Sahara high-pressure cells","The South Atlantic and South Indian highs lie over the oceans. The Kalahari (continental) high lies over the interior."],
["loc","What is a berg wind?","A hot, dry wind that blows from the interior plateau down to the coast","A cold, wet wind from the sea","A wind that blows up a valley during the day","A tropical storm","The air sinks down the escarpment and warms adiabatically. Berg winds occur mainly in winter and increase the risk of veld fires."],
["loc","Why does the interior of South Africa get very little rain in winter?","The Kalahari high-pressure cell is strong and its sinking air creates an inversion","Tropical cyclones block the rain","The sun is directly overhead","Cold fronts cannot form in winter","The inversion layer lies below the level of the plateau and stops moist air from reaching the interior."],
["loc","What is a katabatic wind?","Cold, dense air that flows down a slope at night","Warm air that rises up a slope during the day","A wind between two cities","A sea breeze","At night the slopes cool, the air in contact with them becomes dense and drains into the valley. An upslope wind by day is anabatic."],
["loc","What is an urban heat island?","A city that is warmer than the surrounding rural area","A city that is built on an island","A rural area that is warmer than a city","A city with no pollution","Tar and concrete absorb heat, buildings trap it, and vehicles, factories and air conditioners release more."],
["loc","In the Southern Hemisphere, which slopes of a valley are warmer?","North-facing slopes","South-facing slopes","East-facing slopes","All slopes are equally warm","North-facing slopes receive more direct sunlight, so they are preferred for settlement and for crops that need warmth."],

["geo","What is a drainage basin?","The area drained by a river and its tributaries","The point where a river enters the sea","The high ground between two rivers","The source of a river","The boundary between two drainage basins is called a watershed."],
["geo","Which drainage pattern looks like the branches of a tree and forms on rock with uniform resistance?","Dendritic","Trellis","Radial","Rectangular","Trellis patterns form on folded or alternating hard and soft rock. Radial patterns form on domes and volcanoes."],
["geo","Which features can be seen after river capture (stream piracy)?","An elbow of capture, a wind gap and a misfit stream","A delta, a levee and a flood plain","A meander, an oxbow lake and a braided stream","A waterfall, a gorge and a plunge pool","The more energetic river erodes backward and takes over the headwaters of another river."],
["geo","How does an oxbow lake form?","A meander loop is cut off from the river","A river is dammed by a landslide","A waterfall retreats","A delta grows into the sea","Erosion on the outer banks narrows the meander neck until the river breaks through and the old loop is sealed off by deposition."],
["geo","Which features show that a river has been rejuvenated?","Knickpoints, river terraces and incised meanders","Levees and deltas","Oxbow lakes and marshes","Alluvial fans","Rejuvenation gives the river new energy to erode downward, for example after uplift of the land or a drop in sea level."],
["geo","What is the shape of the longitudinal profile of a graded river?","Smooth and concave","Convex","Full of waterfalls and rapids","Perfectly flat","A graded river is in balance between erosion and deposition along its course."],

["rural","What is the 'site' of a settlement?","The actual piece of land on which it is built","Its position in relation to other places","The number of people who live there","The services it offers","Situation refers to the settlement's position in relation to its surroundings, such as roads, rivers and other towns."],
["rural","What is a nucleated settlement?","A settlement in which buildings are grouped close together","A settlement of isolated farmsteads far apart","A settlement along a road","A settlement with no people","People in nucleated settlements can share services and ideas. Isolated farmsteads form a dispersed pattern."],
["rural","Which is a push factor in rural-urban migration?","A lack of jobs and services in rural areas","Better schools in cities","Higher wages in cities","Entertainment in cities","Push factors drive people away from rural areas. Pull factors attract them to cities."],
["rural","What is a result of rural depopulation?","Services such as shops and schools close down","More jobs are created in rural areas","Farm production always increases","Cities become smaller","Mostly young adults leave, so an ageing population remains and businesses lose customers."],
["rural","Which land reform programme returns land, or pays compensation, to people who were dispossessed after 1913?","Land restitution","Land redistribution","Land tenure reform","Land invasion","Redistribution makes land available to previously disadvantaged people. Tenure reform gives people secure rights to the land they live on."],

["urban","What is urbanisation?","An increase in the percentage of the population living in urban areas","An increase in the size of farms","The movement of people from cities to farms","The growth of the total population","Urban growth is an increase in the number of people in cities. Urbanisation is about the proportion."],
["urban","Which land-use zone has the highest land values and the tallest buildings?","The central business district (CBD)","The rural-urban fringe","The heavy industrial zone","The low-income residential zone","The CBD is the most accessible part of the city, so competition for land there is highest."],
["urban","Which urban model shows land-use zones as rings around the CBD?","The concentric zone model of Burgess","The sector model of Hoyt","The multiple nuclei model of Harris and Ullman","The central place theory","Hoyt's model has wedge-shaped sectors along transport routes. The multiple nuclei model has several centres."],
["urban","What is urban sprawl?","The unplanned, outward spread of a city into surrounding rural land","The rebuilding of the inner city","The movement of shops into the CBD","A decrease in a city's population","Sprawl uses up farmland, lengthens travel times and makes services more expensive to provide."],
["urban","In central place theory, what is the 'threshold population'?","The minimum number of customers a business or service needs to stay open","The maximum distance people will travel for a service","The total population of a city","The number of towns in a region","The 'range' is the maximum distance people are willing to travel to obtain a good or service."],
["urban","What is commercial decentralisation?","The movement of shops and offices out of the CBD to the suburbs","The building of more offices in the CBD","The closing of all suburban shopping centres","The movement of factories to harbours","Traffic congestion, high rents, lack of parking and crime in the CBD encourage businesses to move to suburban centres."],

["econ","Which economic sector extracts raw materials from nature?","Primary sector","Secondary sector","Tertiary sector","Quaternary sector","Farming, fishing, forestry and mining are primary activities. Manufacturing is secondary and services are tertiary."],
["econ","Which is South Africa's largest core industrial region?","Gauteng (PWV)","Durban-Pinetown (eThekwini)","South-western Cape","Port Elizabeth-Uitenhage (Nelson Mandela Bay)","Gauteng has minerals, a large market and labour force, and good transport links, although it is far from the coast."],
["econ","Which describes the informal sector?","Small-scale businesses that are not registered and do not pay income tax","Large companies listed on the JSE","Government departments","Mining companies","Examples are street vendors and spaza shops. The sector provides an income for many people without formal jobs."],
["econ","What is food security?","When all people have access to enough safe and nutritious food at all times","When a country exports all its food","When food prices are very high","When only commercial farmers grow food","Food insecurity is increased by drought, poverty, rising prices and the loss of farmland."],
["econ","What is a footloose industry?","An industry that is not tied to one location by raw materials or markets","An industry that must be at a harbour","A mining company","An industry that uses only heavy raw materials","Light, high-technology industries can locate almost anywhere with good transport and communication."],
["econ","Which is the main industry of the Port Elizabeth-Uitenhage (Nelson Mandela Bay) industrial region?","Motor vehicle manufacturing","Gold mining","Sugar refining","Wine making","Vehicle assembly plants and component suppliers dominate. The Coega SEZ is also in this region."],

["map","On a 1 : 50 000 topographic map, 1 cm on the map represents:","500 m on the ground","50 m on the ground","5 km on the ground","50 km on the ground","1 cm represents 50 000 cm = 500 m = 0,5 km."],
["map","What do contour lines that are close together show?","A steep slope","A gentle slope","Flat land","A river","The closer the contour lines, the steeper the slope. Lines far apart show a gentle slope."],
["map","What is the scale of a South African orthophoto map?","1 : 10 000","1 : 50 000","1 : 250 000","1 : 1 000","An orthophoto map is five times larger in scale than the 1 : 50 000 topographic map, so it shows more detail of a smaller area."],
["map","In GIS, what is buffering?","Marking out a zone of a set distance around a feature","Removing data from a map","Changing a map's scale","Taking photographs from an aircraft","For example, a 100 m buffer along a river shows where building should not be allowed."],
["map","How is vector data stored in a GIS?","As points, lines and polygons","As a grid of pixels","As photographs only","As sound files","Raster data is stored as a grid of cells (pixels), for example satellite images."],
["map","What is remote sensing?","Collecting information about the Earth's surface from a distance, using satellites or aircraft","Measuring distances with a ruler on a map","Interviewing people in a settlement","Drawing a cross-section","Remote sensing provides the images used in many GIS applications."]
],

q:[
["cold","What was the aim of the Truman Doctrine of 1947?","To contain the spread of communism by supporting countries threatened by it","To divide Germany into four zones","To form a military alliance with the Soviet Union","To end the Second World War","President Truman promised American help, first to Greece and Turkey. This policy became known as containment."],
["cold","What was the Marshall Plan?","An American programme of economic aid to rebuild Europe after the Second World War","A Soviet plan to blockade Berlin","A military alliance of Western countries","A plan to place missiles in Cuba","The USA believed that poverty made countries turn to communism. The USSR and its satellite states rejected the aid."],
["cold","How did the Western powers respond to the Berlin Blockade of 1948 to 1949?","They flew supplies into West Berlin in the Berlin Airlift","They invaded East Germany","They built the Berlin Wall","They withdrew from Berlin","For almost a year aircraft carried food and fuel into West Berlin until Stalin lifted the blockade."],
["cold","Which military alliance was formed by Western countries in 1949?","NATO","The Warsaw Pact","The United Nations","COMECON","The Soviet Union and its allies formed the Warsaw Pact in 1955 in response."],
["cold","In which year was the Berlin Wall built?","1961","1948","1955","1989","The East German government built it to stop people leaving for the West. It stood until 1989."],
["cold","Who were the leaders of the USA and the USSR during the Cuban Missile Crisis of 1962?","John F Kennedy and Nikita Khrushchev","Harry Truman and Joseph Stalin","Ronald Reagan and Mikhail Gorbachev","Richard Nixon and Leonid Brezhnev","The crisis ended when Khrushchev agreed to remove Soviet missiles from Cuba. The USA promised not to invade Cuba and secretly agreed to remove its missiles from Turkey."],

["viet","What was the 'domino theory'?","The belief that if one country became communist, its neighbours would follow","The plan to bomb North Vietnam","The idea that all countries should be neutral","A Vietcong guerrilla tactic","This belief was the main reason the USA became involved in Vietnam."],
["viet","Which event in 1964 led to the USA sending large numbers of combat troops to Vietnam?","The Gulf of Tonkin incident","The Tet Offensive","The fall of Saigon","The Battle of Dien Bien Phu","After reported attacks on US ships, Congress gave President Johnson the power to escalate the war."],
["viet","Why was the Tet Offensive of 1968 a turning point?","It showed Americans that the war was far from won, and public opinion turned against it","The USA won the war","North Vietnam surrendered","China invaded Vietnam","Although the attacks were beaten back, television coverage shocked the American public."],
["viet","What was the policy of 'Vietnamisation'?","Handing the fighting over to the South Vietnamese army while US troops withdrew","Sending more US troops to Vietnam","Uniting North and South Vietnam under communism","Bombing Cambodia only","President Nixon introduced it so that the USA could leave the war."],
["viet","Which tactics did the Vietcong use against the better-equipped US forces?","Guerrilla warfare: ambushes, tunnels and booby traps","Large tank battles","Naval blockades","Nuclear weapons","They knew the terrain, had support from villagers and were supplied along the Ho Chi Minh Trail."],
["viet","What happened in 1975?","Saigon fell to North Vietnamese forces and Vietnam was united under a communist government","The USA began bombing North Vietnam","The Gulf of Tonkin incident took place","Vietnam was divided into north and south","The last US combat troops had left in 1973 after the Paris Peace Accords."],

["afr","Who became the first prime minister of the independent Congo in 1960?","Patrice Lumumba","Mobutu Sese Seko","Julius Nyerere","Agostinho Neto","Lumumba was removed from power and killed in 1961."],
["afr","Which leader took power in the Congo in 1965 and later renamed the country Zaire?","Mobutu Sese Seko","Patrice Lumumba","Moise Tshombe","Jonas Savimbi","Mobutu ruled as a dictator with a one-party state and was supported by Western countries during the Cold War."],
["afr","What was 'Ujamaa' in Tanzania?","Julius Nyerere's policy of African socialism based on village cooperation","A military alliance with the USA","A policy of free-market capitalism","A liberation army in Angola","The policy was set out in the Arusha Declaration of 1967 and stressed self-reliance."],
["afr","Angola became independent in 1975. From which colonial power?","Portugal","Belgium","Britain","France","Independence was followed by civil war between the MPLA, UNITA and the FNLA."],

["civ","What did the US Supreme Court rule in Brown v Board of Education in 1954?","Segregation in public schools was unconstitutional","Segregated buses were legal","Black Americans could not vote","Schools must remain separate but equal","The ruling overturned the 'separate but equal' principle in education."],
["civ","Whose arrest led to the Montgomery Bus Boycott of 1955 to 1956?","Rosa Parks","Martin Luther King Jr","Malcolm X","Elizabeth Eckford","She refused to give up her seat to a white passenger. The boycott lasted more than a year and ended segregation on the city's buses."],

["civ","Who founded the Black Panther Party in 1966?","Huey Newton and Bobby Seale","Martin Luther King Jr and Rosa Parks","Malcolm X and Stokely Carmichael","Jesse Jackson and John Lewis","The party stood for self-defence against police brutality and ran community programmes such as free breakfasts for children."],
["civ","What did the Voting Rights Act of 1965 do?","It banned practices, such as literacy tests, that were used to stop black Americans from voting","It ended segregation in schools","It gave women the right to vote","It created the Black Panther Party","It followed the Selma to Montgomery marches."],

["bc","Which organisation did Steve Biko help to found in 1968 and 1969?","The South African Students' Organisation (SASO)","The United Democratic Front (UDF)","The Congress of South African Trade Unions (COSATU)","The Pan Africanist Congress (PAC)","SASO was formed when black students broke away from NUSAS. Biko was its first president."],
["bc","What was the main idea of Black Consciousness?","Black people should free themselves psychologically, be proud of who they are and rely on themselves","Black people should wait for white liberals to end apartheid","The homelands should become independent","All political parties should be banned","Biko said that the most powerful weapon of the oppressor is the mind of the oppressed."],

["bc","How did Steve Biko die in September 1977?","From injuries he received while in police detention","In a car accident","In exile in Zambia","Of natural causes at home","His death caused an international outcry. The government banned Black Consciousness organisations the following month."],
["bc","Why was the United Democratic Front (UDF) formed in 1983?","To oppose the Tricameral Parliament and other apartheid 'reforms'","To negotiate at CODESA","To govern the homelands","To replace the ANC in exile","The UDF united hundreds of civic, church, student and worker organisations."],
["bc","What was PW Botha's 'Total Strategy'?","A combination of limited reforms and harsh repression to keep the National Party in power","A plan to release all political prisoners","A plan to hand power to the ANC","A policy of non-violence","It was a response to what the government called the 'total onslaught' against South Africa."],
["bc","How did the international anti-apartheid movement put pressure on the South African government in the 1980s?","Through sanctions, disinvestment and sports and cultural boycotts","By sending armies to invade South Africa","By supporting the Tricameral Parliament","By buying more South African goods","Economic pressure and isolation helped to push the government towards negotiations."],

["dem","What did FW de Klerk announce on 2 February 1990?","The unbanning of the ANC, PAC and SACP and the release of political prisoners","A new state of emergency","The banning of the UDF","The date of the first democratic election","Nelson Mandela was released nine days later, on 11 February 1990."],

["dem","Why did the ANC withdraw from negotiations in June 1992?","Because of the Boipatong massacre","Because Mandela was arrested again","Because the National Party won an election","Because of the death of Chris Hani","The ANC accused the government of being involved in the violence. Talks resumed after the Record of Understanding in September 1992."],
["dem","Which leader was assassinated in April 1993, which nearly derailed the negotiations?","Chris Hani","Steve Biko","Oliver Tambo","Joe Slovo","Mandela appealed for calm on television. Soon afterwards the date for the election was set."],
["dem","When did South Africa's first democratic election take place?","27 April 1994","11 February 1990","16 June 1976","10 May 1996","The ANC won and Nelson Mandela became president of a Government of National Unity. 27 April is Freedom Day."],
["dem","Who chaired the Truth and Reconciliation Commission (TRC)?","Archbishop Desmond Tutu","Nelson Mandela","FW de Klerk","Thabo Mbeki","The TRC began its hearings in 1996."],
["dem","Under which condition could the TRC grant amnesty?","The person fully disclosed a politically motivated crime","The person paid a fine","The person apologised to the victim's family","The person was a member of the government","The TRC aimed for restorative justice. Critics felt that perpetrators escaped punishment and that reparations were too small."],

["glob","When did the Berlin Wall fall?","9 November 1989","13 August 1961","25 December 1991","2 February 1990","It became the symbol of the end of the Cold War. Germany was reunited in 1990."],

["glob","What is globalisation?","The growing economic, political and cultural interconnection between countries","The division of the world into two blocs","The ending of all international trade","Rule by a single world government","It has been driven by trade, technology and communication. Critics argue that it benefits rich countries more than poor ones."]
