q:[
["comp","What does it mean to infer something from a text?","To work out something that is suggested but not directly stated","To copy a sentence from the text","To count the paragraphs","To find the title","Inference is 'reading between the lines', using clues in the text together with what you already know."],
["comp","Which statement is an opinion?","Cape Town is the most beautiful city in the world","Cape Town is in the Western Cape","Table Mountain is in Cape Town","Cape Town has a harbour","An opinion is a personal view that cannot be proved. A fact can be checked."],
["comp","What is the 'tone' of a text?","The writer's attitude towards the subject or the reader","The length of the text","The main character","The order of the paragraphs","Tone can be described with words such as sarcastic, humorous, serious, critical or sympathetic."],
["comp","Which is a rule for writing a summary?","Use your own words and keep within the word limit","Include all the examples from the passage","Quote long sentences directly","Add your own opinion","A summary gives only the main points, in full sentences, and the number of words is stated at the end."],
["comp","What is the difference between denotation and connotation?","Denotation is the dictionary meaning, while connotation is the feeling or association a word carries","Denotation is the feeling a word carries, while connotation is its spelling","They mean the same thing","Denotation applies only to verbs","'Home' denotes a place where someone lives, but it connotes warmth and safety."],
["comp","What is the purpose of a topic sentence?","It states the main idea of a paragraph","It ends the essay","It lists the sources used","It gives the writer's name","The other sentences in the paragraph support or explain the topic sentence."],

["lang","Rewrite in the passive voice: 'The dog bit the boy.'","The boy was bitten by the dog.","The boy bit the dog.","The dog was biting the boy.","The boy is bitten by the dog.","The object (the boy) becomes the subject, and the verb changes to a form of 'to be' plus the past participle, keeping the same tense."],
["lang","Rewrite in reported speech: She said, 'I am tired.'","She said that she was tired.","She said that I am tired.","She says she is tired.","She said that she is being tired.","The pronoun changes from 'I' to 'she', and the verb moves one tense back, from 'am' to 'was'."],
["lang","In the sentence 'He ran quickly', what part of speech is 'quickly'?","Adverb","Adjective","Noun","Preposition","An adverb tells us more about a verb. Here it tells us how he ran."],
["lang","Choose the correct verb: 'The list of items ___ on the desk.'","is","are","were","have been","The subject is 'list', which is singular, so the verb must be singular. This is subject-verb agreement (concord)."],
["lang","Which sentence uses the apostrophe correctly?","The dog wagged its tail.","The dog wagged it's tail.","The dog's wagged their tails.","Its a friendly dog.","'Its' shows possession. 'It's' is a contraction of 'it is' or 'it has'."],
["lang","What does 'the girls' books' mean?","Books that belong to more than one girl","Books that belong to one girl","Books about girls","One book owned by several girls","For a plural noun ending in s, the apostrophe comes after the s. 'The girl's books' would refer to one girl."],
["lang","'She received a free gift.' Which language error does this sentence contain?","Tautology","Malapropism","Ambiguity","A split infinitive","Tautology is the unnecessary repetition of an idea. A gift is always free."],
["lang","Which is a complex sentence?","Although it was raining, we played the match.","We played the match.","It rained and we played.","Rain!","A complex sentence has one main clause and at least one subordinate clause, here introduced by 'although'."],

["vis","In advertising, what does the abbreviation AIDA stand for?","Attention, Interest, Desire, Action","Advert, Image, Design, Appeal","Audience, Idea, Detail, Action","Attract, Inform, Describe, Announce","An effective advertisement catches attention, creates interest and desire, and leads the reader to act."],
["vis","What is a slogan?","A short, catchy phrase that people associate with a product or brand","The picture in an advertisement","The price of the product","The name of the company's owner","Slogans are easy to remember and often use devices such as alliteration, rhyme or puns."],
["vis","What is emotive language?","Words chosen to stir up strong feelings in the reader","Language that states only facts","Technical language used by experts","Language with spelling errors","Advertisers and speech writers use emotive words to persuade."],
["vis","In a cartoon, what does a caricature do?","It exaggerates a person's features for humorous or critical effect","It gives the date of the cartoon","It shows the exact appearance of a person","It explains the joke in words","Political cartoonists exaggerate well-known features so that the person is instantly recognised."],
["vis","What is satire?","The use of humour, irony or exaggeration to criticise people or society","A sad story with a tragic ending","A factual news report","A kind of rhyme","Satire aims to expose foolishness or wrongdoing and to bring about change."],
["vis","What is a stereotype?","A fixed, oversimplified idea about a group of people","A type of font","A drawing technique","A summary of the advertisement","For example, showing all teenagers as lazy. Stereotypes are unfair because they ignore individual differences."],

["lit","Which figure of speech is used in 'Her smile was like sunshine'?","Simile","Metaphor","Personification","Hyperbole","A simile compares two things using 'like' or 'as'."],
["lit","Which figure of speech is used in 'The classroom was a zoo'?","Metaphor","Simile","Alliteration","Onomatopoeia","A metaphor says that one thing is another, without using 'like' or 'as'."],
["lit","Which figure of speech is used in 'The wind whispered through the trees'?","Personification","Simile","Oxymoron","Pun","Personification gives human qualities to something that is not human."],
["lit","What is alliteration?","The repetition of consonant sounds at the beginning of words that are close together","The repetition of vowel sounds","A word that imitates a sound","An exaggeration","For example: 'the slithering snake slid silently'. Repetition of vowel sounds is assonance."],
["lit","'Deafening silence' is an example of:","Oxymoron","Hyperbole","Euphemism","Simile","An oxymoron places two contradictory words next to each other."],
["lit","How many lines does a sonnet have?","14","12","10","16","A Shakespearean (English) sonnet has three quatrains and a rhyming couplet. A Petrarchan (Italian) sonnet has an octave and a sestet."],
["lit","What is enjambment?","A sentence or thought that runs on from one line of a poem to the next without a pause","A pause in the middle of a line","A pair of rhyming lines","A repeated line","Enjambment (a run-on line) speeds up the pace and links ideas."],
["lit","'I've told you a million times' is an example of:","Hyperbole","Understatement","Metaphor","Personification","Hyperbole is deliberate exaggeration for emphasis."],

["drama","What is dramatic irony?","The audience knows something that a character does not know","A character says the opposite of what they mean","An event turns out the opposite of what was expected","A character speaks alone on stage","It creates tension, because the audience waits for the character to find out the truth."],
["drama","What is a soliloquy?","A speech in which a character, alone on stage, speaks their thoughts aloud","A conversation between two characters","A short remark made to the audience while others are on stage","The final scene of a play","A short remark to the audience that other characters do not 'hear' is an aside."],
["drama","Who is the protagonist of a story?","The main character","The character who opposes the main character","The narrator","The author","The character or force that opposes the protagonist is the antagonist."],
["drama","What is the theme of a literary work?","Its central idea or message","Its setting","The order of events","The list of characters","Examples of themes are love, betrayal, ambition and prejudice. The order of events is the plot."],
["drama","What is the climax of a plot?","The point of highest tension, where the conflict reaches its turning point","The introduction of the characters","The background to the story","The final explanation after the conflict is resolved","The usual stages are exposition, rising action, climax, falling action and resolution."],
["drama","A story is told by a character who uses 'I' and 'me'. Which type of narration is this?","First-person narration","Third-person omniscient narration","Second-person narration","Stage directions","A first-person narrator shares their own thoughts but cannot know what other characters are thinking."],

["writ","How does an argumentative essay differ from a discursive essay?","An argumentative essay defends one point of view, while a discursive essay considers both sides","An argumentative essay tells a story","A discursive essay describes a place","There is no difference","In a discursive essay the writer weighs up both sides and may reach a balanced conclusion."],
["writ","What is the purpose of a narrative essay?","To tell a story","To give instructions","To present two sides of an argument","To describe a process","A narrative essay has a setting, characters, a conflict and a resolution, and is usually written in the past tense."],
["writ","A formal letter begins with 'Dear Sir/Madam'. How should it end?","Yours faithfully","Yours lovingly","Cheers","Your friend","'Yours faithfully' is used when the recipient's name is not known. 'Yours sincerely' is used when the letter is addressed to a named person."],
["writ","Which is the correct order of the writing process?","Planning, drafting, revising and editing, proofreading, presenting","Drafting, presenting, planning","Proofreading, planning, drafting","Presenting, editing, planning","Planning (for example with a mind map) comes first, and the final version is written only after editing and proofreading."],
["writ","What does 'register' mean in writing?","The level of formality of the language, chosen to suit the audience and purpose","A list of learners","The length of the text","The handwriting used","A letter to a friend uses an informal register. A letter of application uses a formal register."],
["writ","Which of these must appear in the minutes of a meeting?","The decisions that were taken","A slogan","A recipe","The writer's opinion of each speaker","Minutes record the date, those present, apologies, matters discussed and decisions taken, in the order of the agenda."]
],
terms:[
["Simile","A comparison of two things using 'like' or 'as'."],
["Metaphor","A direct comparison that says one thing is another."],
["Personification","Giving human qualities to something that is not human."],
["Alliteration","Repetition of consonant sounds at the beginning of nearby words."],
["Assonance","Repetition of vowel sounds in nearby words."],
["Onomatopoeia","A word that imitates the sound it describes, such as 'buzz' or 'crash'."],
["Hyperbole","Deliberate exaggeration for effect."],
["Oxymoron","Two contradictory words placed together, such as 'bitter sweet'."],
["Irony","Saying the opposite of what is meant, or an outcome that is the opposite of what was expected."],
["Euphemism","A mild expression used in place of a harsh or blunt one, such as 'passed away'."],
["Pun","A play on words that have more than one meaning or that sound alike."],
["Tone","The writer's or speaker's attitude, shown through word choice."],
["Register","The level of formality of language, suited to the audience and purpose."],
["Concord","Agreement between the subject and the verb of a sentence."],
["Dramatic irony","When the audience knows something that a character does not."],
["Theme","The central idea or message of a literary work."]
]});

/* Number drills. Each gen() returns {q, a, unit, show, w, tol}. Answers are never negative. */
(function(){
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function R(n){var neg=n<0;n=Math.abs(n);var whole=Math.floor(n+1e-9),c=Math.round((n-whole)*100);if(c===100){whole++;c=0}
  var s=String(whole).replace(/\B(?=(\d{3})+(?!\d))/g," ");return (neg?"-":"")+"R"+s+(c?","+(c<10?"0":"")+c:"")}
function num(n,d){var s=(Math.round(n*Math.pow(10,d||0))/Math.pow(10,d||0)).toFixed(d||0);var p=s.split(".");p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g," ");return p.join(",")}
function trim(n){return String(Math.round(n*100)/100).replace(".",",")}
LL.fmtR=R;

sum8:{name:"Equation and profit sums",kind:"num",lead:"Use Assets = Owner's equity + Liabilities, and Profit = Income − Expenses.",gen:function(){
  var t=Math.floor(Math.random()*5),l=pick([5000,12000,20000,35000]),oe=pick([15000,30000,48000,60000]),a=l+oe,inc,ex,o,r,pm;
  if(t===0)return {q:"Assets are "+R(a)+" and liabilities are "+R(l)+". Calculate the owner's equity.",a:oe,unit:"rand",show:R(oe),w:"Owner's equity = Assets − Liabilities = "+R(a)+" − "+R(l)+" = "+R(oe)+".",tol:0.5};
  if(t===1)return {q:"Owner's equity is "+R(oe)+" and liabilities are "+R(l)+". Calculate the total assets.",a:a,unit:"rand",show:R(a),w:"Assets = Owner's equity + Liabilities = "+R(oe)+" + "+R(l)+" = "+R(a)+".",tol:0.5};
  if(t===2)return {q:"Assets are "+R(a)+" and owner's equity is "+R(oe)+". Calculate the liabilities.",a:l,unit:"rand",show:R(l),w:"Liabilities = Assets − Owner's equity = "+R(a)+" − "+R(oe)+" = "+R(l)+".",tol:0.5};
  if(t===3){ex=pick([4000,6500,9000,12500]);inc=ex+pick([1500,3000,5500,8000]);
    return {q:"A service business earned income of "+R(inc)+" and had expenses of "+R(ex)+" for the month. Calculate the profit.",a:inc-ex,unit:"rand",show:R(inc-ex),w:"Profit = Income − Expenses = "+R(inc)+" − "+R(ex)+" = "+R(inc-ex)+".",tol:0.5}}
  o=pick([2000,5000,8000]);r=pick([6000,9500,14000]);pm=pick([3000,4500,7000]);
  return {q:"The bank balance at the start of the month was "+R(o)+". Total receipts were "+R(r)+" and total payments were "+R(pm)+". Calculate the bank balance at the end of the month.",a:o+r-pm,unit:"rand",show:R(o+r-pm),w:"Closing balance = opening balance + receipts − payments\n= "+R(o)+" + "+R(r)+" − "+R(pm)+" = "+R(o+r-pm)+".",tol:0.5};
}},
markup:{name:"Mark-up",kind:"num",lead:"Cost price, selling price and mark-up percentage. Mark-up is always worked out on cost price.",gen:function(){
  var c=pick([80,120,200,240,400,600,1200]),m=pick([20,25,50,60,75,100]),s=c*(100+m)/100,t=Math.floor(Math.random()*4);
  if(t===0)return {q:"Cost price is "+R(c)+" and the mark-up is "+m+"% on cost. What is the selling price?",a:s,unit:"rand",show:R(s),w:"Mark-up = "+R(c)+" x "+m+"% = "+R(c*m/100)+".\nSelling price = "+R(c)+" + "+R(c*m/100)+" = "+R(s)+".",tol:0.5};
  if(t===1)return {q:"Selling price is "+R(s)+" and the mark-up is "+m+"% on cost. What is the cost price?",a:c,unit:"rand",show:R(c),w:"Cost price = "+R(s)+" x 100/"+(100+m)+" = "+R(c)+".",tol:0.5};
  if(t===2)return {q:"Goods that cost "+R(c)+" are sold for "+R(s)+". What is the mark-up percentage on cost?",a:m,unit:"%",show:m+"%",w:"Profit = "+R(s)+" - "+R(c)+" = "+R(s-c)+".\nMark-up = "+R(s-c)+" / "+R(c)+" x 100 = "+m+"%.",tol:0.5};
  return {q:"Sales for the month are "+R(s*10)+" at a mark-up of "+m+"% on cost. What is the cost of sales?",a:c*10,unit:"rand",show:R(c*10),w:"Cost of sales = "+R(s*10)+" x 100/"+(100+m)+" = "+R(c*10)+".",tol:0.5};
}},

    return {q:"Current assets are "+R(ca)+" and current liabilities are "+R(cl)+". Calculate the current ratio (x : 1).",a:r,unit:"x in x : 1",show:trim(r)+" : 1",w:"Current ratio = current assets : current liabilities\n= "+R(ca)+" : "+R(cl)+" = "+trim(r)+" : 1.",tol:0.051}}

math12:{name:"Quick calculations",kind:"num",lead:"Short sums on sequences, calculus, finance and analytical geometry. A calculator is allowed.",gen:function(){
  var t=Math.floor(Math.random()*7),a,d,n,r,k,b,c,P,i,x,y,S;
  if(t===0){a=pick([2,3,5,7,10]);d=pick([2,3,4,5,6]);n=pick([10,12,15,20,25]);
    return {q:"An arithmetic sequence starts "+a+"; "+(a+d)+"; "+(a+2*d)+"; ... What is term "+n+"?",a:a+(n-1)*d,unit:"",show:String(a+(n-1)*d),w:"a = "+a+" and d = "+d+".\nTₙ = a + (n − 1)d = "+a+" + ("+(n-1)+")("+d+") = "+(a+(n-1)*d)+".",tol:0.01}}
  if(t===1){a=pick([2,3,5]);r=pick([2,3]);n=pick([4,5,6]);
    return {q:"A geometric sequence starts "+a+"; "+(a*r)+"; "+(a*r*r)+"; ... What is term "+n+"?",a:a*Math.pow(r,n-1),unit:"",show:String(a*Math.pow(r,n-1)),w:"a = "+a+" and r = "+r+".\nTₙ = arⁿ⁻¹ = "+a+" × "+r+"^"+(n-1)+" = "+(a*Math.pow(r,n-1))+".",tol:0.01}}
  if(t===2){a=pick([1,2,4,5]);d=pick([2,3,4]);n=pick([10,12,20]);S=n/2*(2*a+(n-1)*d);
    return {q:"Calculate the sum of the first "+n+" terms of the arithmetic series "+a+" + "+(a+d)+" + "+(a+2*d)+" + ...",a:S,unit:"",show:String(S),w:"Sₙ = n/2 [2a + (n − 1)d]\n= "+n+"/2 [2("+a+") + ("+(n-1)+")("+d+")] = "+S+".",tol:0.01}}
  if(t===3){a=pick([1,2,3,4]);b=pick([1,3,5,6]);c=pick([2,4,7]);k=pick([1,2,3,4]);
    return {q:"f(x) = "+(a===1?"":a)+"x² + "+b+"x + "+c+". Calculate f′("+k+").",a:2*a*k+b,unit:"",show:String(2*a*k+b),w:"f′(x) = "+(2*a)+"x + "+b+".\nf′("+k+") = "+(2*a)+"("+k+") + "+b+" = "+(2*a*k+b)+".",tol:0.01}}
  if(t===4){P=pick([1000,5000,10000,20000]);i=pick([5,8,10,12]);n=pick([2,3]);S=P*Math.pow(1+i/100,n);
    return {q:R(P)+" is invested at "+i+"% p.a. compounded annually. What is it worth after "+n+" years? Round to the nearest rand.",a:S,unit:"rand",show:R(Math.round(S*100)/100),w:"A = P(1 + i)ⁿ = "+num(P)+"(1 + "+num(i/100,2)+")^"+n+" = "+R(Math.round(S*100)/100)+".",tol:1}}
  if(t===5){k=pick([1,2,3,4]);x=pick([1,2,3,5]);y=pick([1,2,4,6]);
    return {q:"Calculate the distance between the points ("+x+"; "+y+") and ("+(x+3*k)+"; "+(y+4*k)+").",a:5*k,unit:"units",show:String(5*k),w:"d = √[(x₂ − x₁)² + (y₂ − y₁)²] = √["+(3*k)+"² + "+(4*k)+"²] = √"+(25*k*k)+" = "+(5*k)+".",tol:0.01}}
  S=pick([8,12,20,36]);r=pick([[1,2],[1,4],[3,4]]);a=S*(1-r[0]/r[1]);
  return {q:"A geometric series has first term "+a+" and common ratio "+r[0]+"/"+r[1]+". Calculate the sum to infinity.",a:S,unit:"",show:String(S),w:"S∞ = a/(1 − r) = "+a+" / (1 − "+r[0]+"/"+r[1]+") = "+S+".",tol:0.01};
}},

  var d=D(),b=e.target.closest("button");if(!b)return;
  if(b.dataset.deck){fc.deck=b.dataset.deck;fc.i=0;fc.back=false;cardsView();return}
  if(b.dataset.del){d.cards=d.cards.filter(function(c){return c.id!==b.dataset.del});save();navCount();fc.i=0;fc.back=false;cardsView();return}
  var id=b.id,n=fc.terms.length;
  if(id==="flash"||id==="fcFlip"){fc.back=!fc.back;cardsView(true);var f=$("flash");if(f)f.focus()}
  else if(id==="fcGot"){d.cards.splice(fc.i,1);d.fixed++;save();navCount();fc.back=false;cardsView(true)}
  else if(id==="fcKeep"||id==="fcSkip"){d.cards.push(d.cards.splice(fc.i,1)[0]);save();fc.back=false;cardsView(true)}
  else if(id==="fcPrev"){fc.i=(fc.i-1+n)%n;fc.back=false;cardsView(true)}
  else if(id==="fcNextT"){fc.i=(fc.i+1)%n;fc.back=false;cardsView(true)}
  else if(id==="fcShuf"){fc.terms=shuffle(fc.terms);fc.i=0;fc.back=false;cardsView(true)}
}
function addSubmit(){
  var f=$("ownFront").value.trim(),b=$("ownBack").value.trim();if(!f||!b)return;
  addCard(f,b,"My own correction");fc.deck="corr";fc.i=D().cards.length-1;fc.back=false;fc.addOpen=false;cardsView();
}

/* ---------- past papers ---------- */
var G12PAPERS=[
 ["DBE: National Senior Certificate past examination papers","https://www.education.gov.za/Curriculum/NationalSeniorCertificate(NSC)Examinations/NSCPastExaminationpapers.aspx","The Department of Basic Education's own archive of Grade 12 question papers and marking guidelines, by year and subject."],
 ["DBE: Mind the Gap study guides","https://www.education.gov.za/Curriculum/LearningandTeachingSupportMaterials(LTSM)/MindtheGapStudyGuides/tabid/670/Default.aspx","Free CAPS-aligned Grade 12 study guides from the department, for languages and many content subjects."],
 ["Western Cape Education Department: Grade 12 question papers and memos","https://westerncape.gov.za/education/documents?media_category=3263","NSC papers and memos from 2009 onwards, grouped by exam sitting."]
];
function papersView(){
  var s=cur.sub,list=s.papers||G12PAPERS;
  $("view").innerHTML='<p class="lead">'+esc(s.papersLead||('Open a past paper, look for '+s.name.replace(" (EMS)","")+', write it under exam conditions and mark it with the marking guideline. Then add what you missed to your corrections deck.'))+'</p>'+
   '<div class="card papers">'+list.map(function(p){return '<div><a href="'+p[1]+'" target="_blank" rel="noopener">'+esc(p[0])+'</a><p>'+esc(p[2])+'</p></div>'}).join("")+'</div>'+
   '<p class="lead">The questions inside this app were written for it. They follow the CAPS topics and are not copied from these sources.</p>';
}

/* ---------- events and routing ---------- */
app.addEventListener("click",function(e){
  var g=e.target.closest("[data-act='grade']");
  if(g){S.grade=+g.dataset.g;save();renderHome();var b=document.querySelector(".gswitch [aria-pressed='true']");if(b)b.focus();return}
  if(!cur.sub||!e.target.closest("#view"))return;
  if(cur.tab==="topics")topicsClick(e);else if(cur.tab==="drills")drillsClick(e);else if(cur.tab==="cards")cardsClick(e);
});
app.addEventListener("submit",function(e){
  e.preventDefault();
  if(e.target.id==="numForm")numSubmit();else if(e.target.id==="addForm")addSubmit();
});
app.addEventListener("toggle",function(e){if(e.target.id==="addBox")fc.addOpen=e.target.open},true);
function route(){
  var m=location.hash.match(/^#\/s\/([\w-]+)(?:\/(\w+))?/),s=m&&LL.byId[m[1]];
  if(s){
    if(!cur.sub||cur.sub.id!==s.id){quiz=null;dr={};jr={streak:0};eq={}}
    cur.sub=s;cur.tab=m[2]||"topics";
    if(S.grade!==s.grade){S.grade=s.grade;save()}
    renderSubject();
  }else{cur.sub=null;renderHome()}
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
route();
})();
